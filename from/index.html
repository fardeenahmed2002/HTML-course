<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>form tag</title>
</head>
<body>
	<h1>form tag</h1><br> 
	<form action="form-sig-up.html">
	
	
	
			<label for="first_name">First name:</label> <br>
			<input type="text" name="first_name" id="first_name" placeholder="first name"> <br>
			
			<br>
			 
			<label for="last_name">Lastname</label> <br>
			<input type="text" name="last_name" id="last_name"> <br>
			
			<br> 
			
			<label for="password">Password</label> <br> 
			<input type="password" name="password" id="password"> <br>
			
			<br> 
			
			<u>Gender</u> <br>
			<input type="radio" name="gender" value="male" id="male"> <label for="male">Male</label> <br>
			<input type="radio" name="gender" value="female" id="female"><label for="female">Female</label> <br> 
			<input type="radio" name="gender" value="others" id="others"><label for="others">others</label> <br>
			
			<br> 
			
			<u>Qualification</u> <br>
			<input type="checkbox" name="qualification" value="PSC" id="PSC"> <label for="PSC">PSC</label> <br>
			<input type="checkbox" name="qualification" value="JSC" id="JSC"><label for="JSC">JSC</label> <br> 
			<input type="checkbox" name="qualification" value="SSC" id="SSC"><label for="SSC">SSC</label> <br> 
			<input type="checkbox" name="qualification" value="HSC" id="HSC"><label for="HSC">HSC</label> <br> 
			<br> <br> <br> 
			
			<input type="submit" name="submit" value="submit"> <br> <br>
			
			<input type="reset" name="reset" value="reset"> <br> <br> <br>
			
			<h1>label দিয়ে নামের উপর arrow sign আসবে। for দিয়ে নামের উপর click করলে direct box এ আসবে। place holder দিয়ে box এর উপর নাম দেখা যাবে।  id আলাদা হবে। id=for,value হলো form এ কোন কিছুকে fix করে দেওয়া</h1> <br>
			
			
			
			
			
			
			
			
			
			
			
	
	</form>
</body>
</html>
