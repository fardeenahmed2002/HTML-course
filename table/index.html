<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>table</title>
</head>
<body>
	<table table border="1" width="500" height="100"> 
		<tr> 
			<th>id</th>
			<th>first name</th>
			<th>last name</th>
			<th>mobile no</th>
		</tr>
		<tr> 
			<td>1</td>
			<td>cg</td>
			<td>jh</td>
			<td>0251</td>	
		</tr>
		<tr> 
			<td>2</td>
			<td>ng</td>
			<td>ef</td>
			<td>025fgf</td>	
		</tr> 
		<tr> 
			<td>3</td>
			<td>ngfb</td>
			<td>esfbf</td>
			<td>025dsbfgf</td>	
		</tr>
	
	
	
	
	
	</table><br>
	<br>
	<br>
	
	
	
	<table table border="1" width="500" height="100"> 
		<tr> 
			<th>id</th>
			<th colspan="2">full name</th>
			<th rowspan="2">mobile no</th>
		</tr>
		<tr> 
			<td>1</td>
			<td>cg</td>
			<td>jh</td>	
		</tr>
		<tr> 
			<td rowspan="2">2</td>
			<td colspan="3" align="center">ng</td>	
		</tr> 
		<tr>
			<td>ngfb</td>
			<td>esfbf</td>
			<td>025dsbfgf</td>	
		</tr>
	
	
	
	
	
	</table>
</body>
</html>
